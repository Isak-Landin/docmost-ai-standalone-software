services:
  bridge-db:
    container_name: docmost-mcp-bridge-db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BRIDGE_DB_NAME}
      POSTGRES_USER: ${BRIDGE_DB_USER}
      POSTGRES_PASSWORD: ${BRIDGE_DB_PASSWORD}
    volumes:
      - bridge_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BRIDGE_DB_USER} -d ${BRIDGE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - docmost_network

  # ------------------------------------------------------------
  # Docmost MCP
  # Connects directly to the live Docmost PostgreSQL database
  # and uses its own bridge-owned PostgreSQL database for version state.
  # ------------------------------------------------------------
  docmost-mcp:
    container_name: docmost-mcp
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bridge-db:
        condition: service_healthy
    env_file: .env
    environment:
      DOCMOST_DB_HOST: ${DOCMOST_DB_HOST}
      DOCMOST_DB_PORT: ${DOCMOST_DB_PORT}
      DOCMOST_DB_NAME: ${DOCMOST_DB_NAME}
      DOCMOST_DB_USER: ${DOCMOST_DB_USER}
      DOCMOST_DB_PASSWORD: ${DOCMOST_DB_PASSWORD}
      BRIDGE_DB_HOST: ${BRIDGE_DB_HOST}
      BRIDGE_DB_PORT: ${BRIDGE_DB_PORT}
      BRIDGE_DB_NAME: ${BRIDGE_DB_NAME}
      BRIDGE_DB_USER: ${BRIDGE_DB_USER}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD}
      LISTEN_HOST: ${LISTEN_HOST:-0.0.0.0}
      LISTEN_PORT: ${LISTEN_PORT:-8099}
      DOCMOST_APP_URL: ${DOCMOST_APP_URL}
      DOCMOST_USER_EMAIL: ${DOCMOST_USER_EMAIL}
      DOCMOST_USER_PASSWORD: ${DOCMOST_USER_PASSWORD}
    ports:
      - "${EXTERNAL_PORT:-8099}:${LISTEN_PORT:-8099}"
    networks:
      - docmost_network

  # ------------------------------------------------------------
  # Worker
  # Fixed-interval observer loop. Folds direct-Docmost-UI edits
  # (changes not made through the bridge) into the bridge version state.
  # ------------------------------------------------------------
  docmost-mcp-worker:
    container_name: docmost-mcp-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bridge-db:
        condition: service_healthy
    env_file: .env
    environment:
      DOCMOST_DB_HOST: ${DOCMOST_DB_HOST}
      DOCMOST_DB_PORT: ${DOCMOST_DB_PORT}
      DOCMOST_DB_NAME: ${DOCMOST_DB_NAME}
      DOCMOST_DB_USER: ${DOCMOST_DB_USER}
      DOCMOST_DB_PASSWORD: ${DOCMOST_DB_PASSWORD}
      BRIDGE_DB_HOST: ${BRIDGE_DB_HOST}
      BRIDGE_DB_PORT: ${BRIDGE_DB_PORT}
      BRIDGE_DB_NAME: ${BRIDGE_DB_NAME}
      BRIDGE_DB_USER: ${BRIDGE_DB_USER}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD}
      DOCMOST_APP_URL: ${DOCMOST_APP_URL}
      DOCMOST_USER_EMAIL: ${DOCMOST_USER_EMAIL}
      DOCMOST_USER_PASSWORD: ${DOCMOST_USER_PASSWORD}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-15}
    command: ["python", "-m", "app.observer.worker", "--loop"]
    networks:
      - docmost_network

volumes:
  bridge_db_data:

networks:
  # Shared network with the live Docmost stack.
  # The Docmost PostgreSQL container is reachable inside this network
  # via the hostname configured in DOCMOST_DB_HOST.
  # Set DOCMOST_NETWORK_NAME in .env to match your Docmost stack's Docker network.
  docmost_network:
    external: true
    name: ${DOCMOST_NETWORK_NAME:-docmost_default}
